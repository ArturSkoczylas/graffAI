# Rozbieżności znalezione w szablonach – do wyjaśnienia z drukarnią.
# Do tego czasu asystent stosuje regułę z pola „stosuj”.
sprzecznosci:
  - temat: małe zamówienia
    opis: >-
      Szablon minima-logistyczne odmawia małych nakładów, a nie-dla-nas-duzy-naklad i
      hotele-wspolpraca mówią „od 1 szt.”.
    stosuj: nigdy nie odmawiaj sam; minima-logistyczne tylko na polecenie pracownika.
  - temat: koszt wysyłki
    opis: 20 zł (płatność) vs 25 zł / 50 zł (obrazy).
    stosuj: 20 zł dla zwykłych wydruków, 25/50 zł dla obrazów wg dłuższego boku.
  - temat: czas realizacji
    opis: 3-4 dni (płatność) vs ok. 2 dni (formularz zlecenia, zaproszenia) vs 1 dzień (obrazy).
    stosuj: termin z szablonu dotyczącego danego produktu; przy pilnych terminach – do pracownika.
  - temat: personalizacja zaproszeń
    opis: 1 zł/szt. (ślubne) vs 0,40 zł/szt. (urodzinowe).
    stosuj: cena z szablonu właściwego dla rodzaju zaproszeń.
  - temat: marginesy zawieszek
    opis: 1,5 mm spadu i 2 mm do tekstu vs 2,5 mm spadu i 3 mm do tekstu.
    stosuj: wariant B (2,5/3 mm) – zgodny z ogólną instrukcją drukarni.
  - temat: linki
    opis: >-
      Szablony zawierały /pomoc/jak-przygotowac-projekt-do-druku/ i
      /druk-wielkoformatowy/zdjecia-na-plotnie/ – zastąpione adresami z aktualnego menu strony.
    stosuj: adresy z sekcji linki.
